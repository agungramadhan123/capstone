#  KONFIGURASI HYPERPARAMETER & AUGMENTASI YOLOv8
#  Dataset  : CCTV Lalu Lintas Bubat (Barat + Timur)
#  GPU      : NVIDIA RTX 5060 8GB
#  Model    : yolov8s fine-tuning dari best.pt
#  Total    : ~1831 gambar | Kondisi: Pagi + Malam

# ── PARAMETER TRAINING UTAMA ─
lr0: 0.001          # Learning rate awal — rendah karena fine-tuning
lrf: 0.01           # LR akhir (lr0 * lrf) = 0.00001
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 3.0
warmup_momentum: 0.8
warmup_bias_lr: 0.1
box: 7.5            # Bobot box loss — ditingkatkan untuk bbox stabil di video
cls: 0.5            # Bobot class loss
dfl: 1.5            # Distribution focal loss

# ── AUGMENTASI HSV (Warna/Pencahayaan) ──────────────
# Tujuan: simulasi variasi pencahayaan pagi/malam, glare, shadow
hsv_h: 0.010        # Hue shift kecil — CCTV tidak berubah warna drastis
hsv_s: 0.5          # Saturation — simulasi hujan ringan, lampu basah
hsv_v: 0.4          # Value/brightness — KRITIS: simulasi pagi terang ↔ malam gelap

# ── AUGMENTASI GEOMETRI: 0.0        # ⛔ DIMATIKAN — kamera CCTV statis, rotasi tidak realistis
translate: 0.1      # Translasi ±10% — simulasi getaran kamera ringan
scale: 0.4          # Scale ±40% — simulasi kendaraan dekat/jauh (motor kecil vs truk)
shear: 0.0          # ⛔ DIMATIKAN — shear tidak realistis untuk CCTV overhead
perspective: 0.0    # ⛔ DIMATIKAN — perspektif CCTV statis, tidak perlu distorsi

# ── AUGMENTASI FLIP
flipud: 0.0         # ⛔ DIMATIKAN — kendaraan tidak bisa terbalik vertikal
fliplr: 0.3         # Flip horizontal 30% — simulasi arah berlawanan lalu lintas

# ── AUGMENTASI MOSAIC & MIXING ───────────────────────────────
mosaic: 0.8         # Aktif 80% — sangat efektif untuk dataset kecil ~1800 gambar
                    # Dimatikan di epoch akhir via close_mosaic
mixup: 0.05         # Sangat rendah (5%) — hanya untuk regularisasi ringan
                    # ⚠ Jangan tingkatkan: blur semantik berbahaya untuk objek kecil
copy_paste: 0.1     # Copy-paste 10% — bantu deteksi motor di kemacetan/overlap

# ── AUGMENTASI ERASING
erasing: 0.3        # Random erasing 30% — simulasi oklusi (kendaraan tertutup)
                    # Membantu deteksi saat macet dan overlap antar kendaraan

# ── CLOSE MOSAIC
close_mosaic: 20    # Matikan mosaic di 20 epoch terakhir (dari 300 epoch)
                    # Model perlu "belajar stabilisasi" di akhir training
